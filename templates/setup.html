<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — iCloud Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <div class="setup-wrap">
      <h1>iCloud Downloader</h1>
      <p class="subtitle">Enter your Apple ID credentials to get started.</p>

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <!-- Credential form -->
      <div id="cred-form" {% if needs_2fa %}style="display:none"{% endif %}>
        <div class="card">
          <form method="POST" action="{{ url_for('setup') }}">
            <div class="form-group">
              <label for="apple_id">Apple ID</label>
              <input type="email" id="apple_id" name="apple_id" placeholder="you@icloud.com" required autofocus>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="App-specific password recommended" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Connect</button>
          </form>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-top:12px;text-align:center">
          Credentials are stored locally in SQLite and never transmitted anywhere except to Apple's servers.
        </p>
      </div>

      <!-- 2FA form -->
      <div id="tfa-form" {% if not needs_2fa %}style="display:none"{% endif %}>
        <div class="card">
          <p style="margin-bottom:20px;color:var(--text-muted);font-size:14px">
            A verification code has been sent to your trusted devices.
          </p>
          <form method="POST" action="{{ url_for('setup_verify') }}">
            <div class="form-group">
              <label for="code">Verification Code</label>
              <input type="text" id="code" name="code" placeholder="6-digit code"
                     inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Verify</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
